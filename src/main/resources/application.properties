spring.application.name=archive-backend

# Server
server.port=8080

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/archive_db
spring.datasource.username=archive_user
spring.datasource.password=archive_password
spring.datasource.driver-class-name=org.postgresql.Driver

